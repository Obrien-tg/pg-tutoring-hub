<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Set a new password</title>
  </head>
  <body>
    <main>
      <h1>Set a new password</h1>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Set password</button>
        </form>
      {% else %}
        <p>This password reset link is invalid or has already been used.</p>
      {% endif %}
    </main>
  </body>
</html>
